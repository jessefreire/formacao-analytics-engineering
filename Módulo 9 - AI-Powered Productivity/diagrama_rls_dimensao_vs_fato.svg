<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" role="img" aria-label="RLS aplicada na dimensao versus na fato: o efeito no dashboard">
<title>RLS na dimensão × na fato — o efeito no dashboard</title>
<style>
  :root { color-scheme: light dark; }
  .bg    { fill: #ffffff; }
  .panel { fill: #f7f9fa; stroke: #d8dee4; stroke-width: 1; }
  .tbl   { fill: #ffffff; stroke: #c4ccd4; stroke-width: 1.2; }
  .filt  { fill: #fdeaea; stroke: #cf7f7f; stroke-width: 1.6; }
  .out   { fill: #eef4ff; stroke: #90aed6; stroke-width: 1.2; }
  .hd    { fill: #1f2933; font: 700 15px/1 ui-sans-serif, system-ui, sans-serif; }
  .sub   { fill: #5b6672; font: 400 12px/1 ui-sans-serif, system-ui, sans-serif; }
  .ph    { fill: #1f2933; font: 700 13px/1 ui-sans-serif, system-ui, sans-serif; }
  .tn    { fill: #1f2933; font: 600 12px/1 ui-monospace, Menlo, monospace; }
  .lbl   { fill: #5b6672; font: 400 11.5px/1.3 ui-sans-serif, system-ui, sans-serif; }
  .flbl  { fill: #a33; font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; }
  .ok    { fill: #2b6a3f; font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; }
  .no    { fill: #a33; font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; }
  .arw   { stroke: #7b8794; stroke-width: 1.5; fill: none; marker-end: url(#r); }
  .rule  { stroke: #d8dee4; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #14181c; }
    .panel { fill: #1c2126; stroke: #2f3841; }
    .tbl   { fill: #232a31; stroke: #3d4854; }
    .filt  { fill: #33201f; stroke: #9c5b58; }
    .out   { fill: #1e2a3d; stroke: #4a6a9c; }
    .hd, .ph, .tn { fill: #e6ebf0; }
    .sub, .lbl { fill: #9aa5b1; }
    .flbl, .no { fill: #e08a86; }
    .ok    { fill: #7fc094; }
    .arw   { stroke: #6b7683; }
    .rule  { stroke: #2f3841; }
  }
</style>
<defs>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7b8794"/>
  </marker>
</defs>

<rect class="bg" width="860" height="560"/>
<text class="hd" x="24" y="30">RLS: a tabela onde você aplica decide o que o usuário enxerga</text>
<text class="sub" x="24" y="50">Mesma função, mesmo usuário (só pode ver a agência 4). Muda só a tabela que recebe o row filter.</text>

<!-- ============ PAINEL ESQUERDO ============ -->
<rect class="panel" x="24" y="70" width="396" height="440" rx="10"/>
<text class="ph" x="44" y="98">Row filter na DIMENSÃO</text>
<text class="lbl" x="44" y="118">dim_agencias.numero_agencia</text>

<!-- star schema -->
<rect class="filt" x="44" y="140" width="150" height="46" rx="6"/>
<text class="tn" x="119" y="162" text-anchor="middle">dim_agencias</text>
<text class="flbl" x="119" y="178" text-anchor="middle">row filter aqui</text>

<rect class="tbl" x="250" y="140" width="150" height="46" rx="6"/>
<text class="tn" x="325" y="168" text-anchor="middle">fact_transacoes</text>

<path class="arw" d="M196,163 L246,163"/>
<text class="lbl" x="200" y="132">join</text>

<line class="rule" x1="44" y1="210" x2="400" y2="210"/>
<text class="lbl" x="44" y="232">O que chega ao dashboard:</text>

<rect class="out" x="44" y="244" width="356" height="30" rx="5"/>
<text class="ok" x="56" y="264">✓ total geral da empresa — visível</text>

<rect class="out" x="44" y="282" width="356" height="30" rx="5"/>
<text class="ok" x="56" y="302">✓ detalhamento da agência 4 — visível</text>

<rect class="out" x="44" y="320" width="356" height="46" rx="5"/>
<text class="no" x="56" y="339">✗ as outras agências viram uma linha</text>
<text class="no" x="56" y="355">   agrupada como (nulo)</text>

<text class="lbl" x="44" y="392">Por que o nulo aparece: a query do dashboard faz</text>
<text class="lbl" x="44" y="408">join da fato com a dimensão. As linhas da fato das</text>
<text class="lbl" x="44" y="424">outras agências continuam existindo — só perdem</text>
<text class="lbl" x="44" y="440">o par na dimensão e caem num grupo sem nome.</text>

<rect class="out" x="44" y="458" width="356" height="34" rx="5"/>
<text class="lbl" x="56" y="479">Use quando: “vê o todo, detalha só o seu”.</text>

<!-- ============ PAINEL DIREITO ============ -->
<rect class="panel" x="440" y="70" width="396" height="440" rx="10"/>
<text class="ph" x="460" y="98">Row filter na FATO</text>
<text class="lbl" x="460" y="118">fact_transacoes.fk_agencia</text>

<rect class="tbl" x="460" y="140" width="150" height="46" rx="6"/>
<text class="tn" x="535" y="168" text-anchor="middle">dim_agencias</text>

<rect class="filt" x="666" y="140" width="150" height="46" rx="6"/>
<text class="tn" x="741" y="162" text-anchor="middle">fact_transacoes</text>
<text class="flbl" x="741" y="178" text-anchor="middle">row filter aqui</text>

<path class="arw" d="M612,163 L662,163"/>
<text class="lbl" x="616" y="132">join</text>

<line class="rule" x1="460" y1="210" x2="816" y2="210"/>
<text class="lbl" x="460" y="232">O que chega ao dashboard:</text>

<rect class="out" x="460" y="244" width="356" height="30" rx="5"/>
<text class="no" x="472" y="264">✗ total geral da empresa — não existe mais</text>

<rect class="out" x="460" y="282" width="356" height="30" rx="5"/>
<text class="ok" x="472" y="302">✓ detalhamento da agência 4 — visível</text>

<rect class="out" x="460" y="320" width="356" height="46" rx="5"/>
<text class="ok" x="472" y="339">✓ nenhum resíduo: o dashboard inteiro</text>
<text class="ok" x="472" y="355">   fica filtrado, sem grupo (nulo)</text>

<text class="lbl" x="460" y="392">O filtro corta na origem dos números. Todo</text>
<text class="lbl" x="460" y="408">indicador, gráfico e matriz passa a falar apenas</text>
<text class="lbl" x="460" y="424">da agência do usuário — inclusive as respostas</text>
<text class="lbl" x="460" y="440">do Genie, que respeita o mesmo filtro.</text>

<rect class="out" x="460" y="458" width="356" height="34" rx="5"/>
<text class="lbl" x="472" y="479">Use quando: isolamento completo por agência.</text>

<!-- rodape -->
<text class="lbl" x="24" y="528">Configuração no Unity Catalog (não no dashboard): a função precisa listar TODOS os grupos — grupo fora da função não recebe permissão nenhuma.</text>
<text class="lbl" x="24" y="546">E avise o usuário que existe RLS: sem isso ele lê um número parcial achando que é o total. Interpretação errada é pior que acesso negado.</text>
</svg>
