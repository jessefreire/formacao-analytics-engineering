<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formação AE — Materiais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.min.js"></script>
<style>
:root {
  /* ---------- superficies e texto ---------- */
  --bg: #ffffff; --card: #fafafa; --code-bg: #f4f4f8;
  --card-rgb: 250, 250, 250;
  --border: #e0e0e8; --border-strong: #c9c9d6;

  /* tres niveis de texto: dado, apoio, rotulo */
  --fg: #1a1a2e; --fg-soft: #45455e; --muted: #6b6b80;

  --accent: #2d2d44; --accent-soft: #ededf3;

  /* ---------- semantica ---------- */
  --warn-bg: #fff8e1; --warn-border: #ffe082; --warn-fg: #5c4300;

  /* ---------- escala de espacamento (4/8/12/16/24/32/48) ---------- */
  --sp-1: 0.25rem; --sp-2: 0.5rem; --sp-3: 0.75rem;
  --sp-4: 1rem; --sp-6: 1.5rem; --sp-8: 2rem; --sp-12: 3rem;

  /* ---------- escala tipografica ---------- */
  --fs-xs: 0.6875rem;   /* 11px — rotulo, caption */
  --fs-sm: 0.8125rem;   /* 13px — metadado, tabela, codigo */
  --fs-ui: 0.875rem;    /* 14px — navegacao, botao */
  --fs-body: 1rem;      /* 16px — leitura */

  /* ---------- medida de leitura ---------- */
  --measure: 74ch;      /* linha de texto corrido */
  --measure-wide: 108ch;/* teto do container (tabela, pre) */

  --sidebar-w: 280px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 24px rgba(0,0,0,0.12);
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
  --response: 0.35s;
}
[data-theme="dark"] {
  --bg: #0f0f1a; --card: #161624; --code-bg: #1e1e30;
  --card-rgb: 22, 22, 36;
  --border: #2a2a40; --border-strong: #3d3d5c;

  --fg: #e8e8f0; --fg-soft: #babacf; --muted: #8b8ba8;

  --accent: #c8c8e0; --accent-soft: #23233a;

  /* escuro tem que ser DERIVADO, nao herdado: fundo claro fixo aqui
     virava faixa creme no meio de um app #0f0f1a */
  --warn-bg: #2b2413; --warn-border: #574518; --warn-fg: #f2d78e;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 12px 24px rgba(0,0,0,0.4);
}
@media (prefers-reduced-motion: reduce) {
  :root { --response: 0.01s; }
  *, *::before, *::after {
    animation-duration: 0.01s !important;
    transition-duration: 0.01s !important;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--fg);
  line-height: 1.6; font-size: var(--fs-body);
  display: flex;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* ========== ANIMATIONS ========== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* ========== SPRING ANIMATION HELPERS ========== */
.spring-enter { opacity: 0; transform: translateY(8px); }
.spring-enter-active { opacity: 1; transform: none; }
.spring-exit { opacity: 1; transform: none; }
.spring-exit-active { opacity: 0; transform: translateY(-4px); }

/* ========== SIDEBAR ========== */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w); max-width: var(--sidebar-w);
  border-right: 1px solid var(--border);
  background: rgba(var(--card-rgb, 250,250,250), 0.8);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid rgba(255,255,255,0.4);
  display: flex; flex-direction: column;
  height: 100vh;
  position: relative;
  box-shadow: var(--shadow-md);
  z-index: 10;
  transition: width var(--response) cubic-bezier(0.25,0.46,0.45,0.94), opacity var(--response);
}
[data-theme="dark"] .sidebar {
  background: rgba(var(--card-rgb, 22,22,36), 0.85);
  border-top: 1px solid rgba(255,255,255,0.1);
}
.sidebar-header {
  padding: 1rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
}
.sidebar-title { font-weight: 600; font-size: 0.8125rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.theme-toggle {
  background: var(--code-bg); border: 1px solid var(--border);
  color: var(--fg); width: 32px; height: 32px; padding: 0;
  border-radius: var(--radius-sm); cursor: pointer; font-size: 0.875rem;
  font-family: inherit; display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.theme-toggle:active { transform: scale(0.94); }
.theme-toggle:hover { background: var(--border); }
.theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.nav { padding: 0.5rem; flex: 1; overflow-y: auto; }
.nav-section { margin-bottom: 1rem; }
.nav-label { font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.375rem; padding: 0 0.5rem; }
.nav-link {
  display: block; padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-md);
  color: var(--fg); text-decoration: none; font-size: 0.875rem;
  transition: background 0.12s ease, color 0.12s ease, transform 0.1s ease;
}
.nav-link:active { transform: scale(0.98); }
.nav-link:hover { background: var(--code-bg); }
.nav-link.active { background: var(--accent); color: var(--bg); font-weight: 500; }
.nav-link::before { content: "\2022 "; color: var(--muted); transition: color 0.12s ease; }
.nav-link.active::before { content: "\25B8 "; color: inherit; }

.sidebar-actions { display: flex; align-items: center; gap: 0.375rem; }
.sidebar-toggle {
  background: var(--code-bg); border: 1px solid var(--border);
  color: var(--fg); width: 32px; height: 32px; padding: 0;
  border-radius: var(--radius-sm); cursor: pointer; font-size: 0.875rem;
  font-family: inherit; display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.sidebar-toggle:hover { background: var(--border); }
.sidebar-toggle:active { transform: scale(0.92); }
.sidebar-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ========== COLLAPSED / REDUCED MODE ========== */
[data-sidebar-collapsed="true"] .sidebar {
  width: 64px !important; min-width: 64px !important; max-width: 64px !important;
}
[data-sidebar-collapsed="true"] .sidebar-header { flex-direction: column; justify-content: flex-start; padding: 0.75rem 0.25rem; gap: 0.5rem; }
[data-sidebar-collapsed="true"] .sidebar-actions { flex-direction: column; }
[data-sidebar-collapsed="true"] .sidebar-title { display: none; }
[data-sidebar-collapsed="true"] .resize-handle { width: 12px; background: transparent; }
[data-sidebar-collapsed="true"] .nav { padding: 0.25rem; }
[data-sidebar-collapsed="true"] .nav-section { display: none; }
[data-sidebar-collapsed="true"] .nav-chip {
  display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 0.5rem 0; margin-bottom: 0.375rem;
  background: transparent; border: 1px solid var(--border); border-radius: var(--radius-md);
  color: var(--fg); cursor: pointer; font-family: inherit;
  transition: background 0.15s ease, transform 0.15s ease;
}
[data-sidebar-collapsed="true"] .nav-chip:hover { background: var(--border); }
[data-sidebar-collapsed="true"] .nav-chip:active { transform: scale(0.94); }
[data-sidebar-collapsed="true"] .chip-key { font-size: 0.75rem; font-weight: 600; }

/* ========== MOBILE ========== */

.resize-handle {
  position: absolute; top: 0; right: 0; bottom: 0; width: 4px;
  cursor: col-resize; background: transparent; z-index: 40;
  touch-action: none;
  transition: background 0.15s ease;
}
.resize-handle::before {
  content: ''; position: absolute; top: 0; bottom: 0; left: -6px; width: 10px;
}
.resize-handle:hover, .resize-handle.dragging { background: var(--accent); }

/* ========== MAIN ========== */
.main { flex: 1; overflow-y: auto; padding: clamp(1.5rem, 3vw, 3rem); padding-bottom: 6rem; }
.main-header { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
.main-header-empty { display: flex; align-items: center; gap: 0.5rem; min-height: 2.5rem; }
/* `display: flex` acima vence o [hidden] { display: none } do navegador, entao o
   atributo hidden nao surtia efeito: a faixa "Selecione um material" ficava
   ocupando 40px no topo de TODO material. Mesmo padrao usado no .update-banner. */
.main-header-empty[hidden] { display: none; }
.main-header-empty .empty-hint { color: var(--muted); font-size: 0.875rem; }

.main-title {
  font-size: clamp(1.5rem, 3vw, 2.25rem);
  font-weight: 600; line-height: 1.15;
  letter-spacing: -0.02em;
}
.main-meta { color: var(--muted); font-size: 0.8125rem; margin-top: 0.5rem; }

/* ========== FILE NAV (floating) ========== */
.file-nav {
  position: fixed; right: 0; bottom: 0; z-index: 39;
  left: var(--sidebar-w);
  display: flex; gap: 0.75rem; align-items: stretch;
  padding: 0.75rem 1.5rem;
  background: rgba(var(--card-rgb, 250,250,250), 0.85);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--border);
  transition: left var(--response) cubic-bezier(0.25,0.46,0.45,0.94);
}
[data-sidebar-collapsed="true"] .file-nav { left: 64px; }
[data-theme="dark"] .file-nav {
  background: rgba(var(--card-rgb, 22,22,36), 0.85);
}
.file-nav-btn {
  flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 0.75rem;
  padding: 0.75rem 1.25rem; border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--code-bg); color: var(--fg); cursor: pointer; font-family: inherit;
  text-align: left;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.file-nav-btn.next { flex-direction: row-reverse; text-align: right; }
.file-nav-btn:hover:not(:disabled) { background: var(--border); border-color: var(--accent); }
.file-nav-btn:active { transform: scale(0.98); }
.file-nav-btn:disabled { display: none; }
.file-nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fn-arrow { font-size: 1.25rem; line-height: 1; color: var(--accent); flex-shrink: 0; }
.fn-meta { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; flex: 1; }
.file-nav-btn.next .fn-meta { align-items: flex-end; }
.fn-caption { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.fn-title { font-size: 0.8125rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ========== CONTENT ========== */
/* Texto corrido limitado a ~74 caracteres; tabela, pre e imagem podem
   passar disso, porque ali largura ajuda em vez de atrapalhar.
   O alvo e .markdown-body: e nele que o marked injeta o conteudo. */
.content { width: 100%; max-width: var(--measure-wide); }
.markdown-body > p,
.markdown-body > ul,
.markdown-body > ol,
.markdown-body > blockquote,
.markdown-body > h1,
.markdown-body > h2,
.markdown-body > h3,
.markdown-body > hr { max-width: var(--measure); }
.markdown-body > table,
.markdown-body > pre { max-width: var(--measure-wide); }
.content h1 { font-size: clamp(1.375rem, 2.5vw, 1.75rem); font-weight: 600; line-height: 1.2; margin: 2.5rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); letter-spacing: -0.01em; }
.content h2 { font-size: clamp(1.125rem, 2vw, 1.375rem); font-weight: 600; line-height: 1.3; margin: 2rem 0 0.75rem; letter-spacing: -0.005em; }
/* h3 com --muted ficava MAIS claro que o proprio texto que ele titula:
   hierarquia invertida. Peso e caixa alta pequena dao a distincao sem
   apagar o titulo. */
.content h3 { font-size: var(--fs-ui); font-weight: 700; line-height: 1.4; margin: var(--sp-6) 0 var(--sp-2); color: var(--fg-soft); text-transform: uppercase; letter-spacing: 0.06em; }
.content p { margin: 0.875rem 0; text-wrap: pretty; }
.content ul, .content ol { margin: 0.875rem 0 0.875rem 1.5rem; }
.content li { margin: 0.375rem 0; }
.content code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.85em; background: var(--code-bg); padding: 0.125rem 0.375rem; border-radius: 4px; }
.content pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem; overflow-x: auto; margin: 1.25rem 0; box-shadow: var(--shadow-sm); }
.content pre code { background: none; padding: 0; font-size: 0.8125rem; line-height: 1.6; }
/* O padrao dos materiais e "> **Pegadinha:**" — callout de varias linhas,
   nao citacao curta. Italico e --muted em 4 linhas cansam e enfraquecem
   justamente o trecho que deveria saltar. */
.content blockquote { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: var(--sp-3) var(--sp-4); margin: var(--sp-6) 0; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--fg-soft); }
.content blockquote > :first-child { margin-top: 0; }
.content blockquote > :last-child { margin-bottom: 0; }
.content table { width: 100%; border-collapse: collapse; margin: var(--sp-6) 0; font-size: var(--fs-sm); }
.content th, .content td { border: 1px solid var(--border); padding: var(--sp-2) var(--sp-3); text-align: left; }
.content th { background: var(--code-bg); font-weight: 600; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.content tr:nth-child(even) td { background: var(--card); }
.content hr { border: none; border-top: 1px solid var(--border); margin: var(--sp-8) 0; }
/* O template nao tinha NENHUMA regra de img: os diagramas SVG (820px) saiam
   renderizados no tamanho natural e estouravam a coluna. */
.content img { display: block; max-width: 100%; height: auto; margin: var(--sp-6) auto; }
/* paragrafo que so carrega imagem pode usar a medida larga — diagrama nao le
   como texto, apertar em 74ch atrapalha */
.markdown-body > p:has(> img:only-child) { max-width: var(--measure-wide); }
.content strong { font-weight: 600; }
.content a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.1s ease, color 0.1s ease; }
.content a:hover { border-bottom-color: var(--accent); }

.module-badge {
  display: inline-block; font-size: 0.6875rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: var(--sp-1) var(--sp-2); border-radius: 999px;
  background: var(--code-bg); color: var(--muted); margin-bottom: 1rem;
  transition: background 0.12s ease, color 0.12s ease, transform 0.1s ease;
}
.module-badge:active { transform: scale(0.95); }
/* ========== MOBILE ========== */
@media (max-width: 900px) {
  .sidebar-toggle { display: none; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: none !important; }
  .main { padding: 1.5rem; padding-bottom: 9rem; }
  .mobile-toggle { display: block; position: fixed; bottom: 5.5rem; right: 1.25rem; z-index: 50; background: var(--accent); color: var(--bg); border: none; padding: 0.75rem 1.125rem; border-radius: var(--radius-md); font-weight: 500; font-size: 0.875rem; cursor: pointer; box-shadow: var(--shadow-lg); transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .mobile-toggle:active { transform: scale(0.95); box-shadow: var(--shadow-md); }
  .mobile-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .file-nav { flex-direction: row; }
  .file-nav .fn-title { display: none; }
  .file-nav-btn { max-width: none; padding: 0.625rem; }
  .fn-arrow { font-size: 1rem; }
}
@media (min-width: 901px) { .mobile-toggle { display: none; } }

/* ========== MARKDOWN BODY SPACING ========== */
.markdown-body { line-height: 1.7; }
.markdown-body > * + * { margin-top: 0.75rem; }
.markdown-body h1 { margin-top: 0; }
.markdown-body table { font-size: var(--fs-sm); }

/* ========== TELA DO DESAFIO ==========
   Fora do .markdown-body de proposito: as regras de measure clampam os filhos
   diretos dele em 74ch, e aqui a gente quer a largura do .content (108ch). */
.dsf-resumo { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-top: var(--sp-2); }
.dsf-barra { flex: 1 1 200px; height: 6px; min-width: 140px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
.dsf-barra > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width var(--response) ease; }
.dsf-contagem { font-size: var(--fs-sm); color: var(--fg-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dsf-acoes { display: flex; gap: var(--sp-2); }
.dsf-acao { font-size: var(--fs-xs); padding: var(--sp-1) var(--sp-3); border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--fg-soft); cursor: pointer; font-family: inherit; }
.dsf-acao:hover { background: var(--accent-soft); border-color: var(--border-strong); }

.dsf-lista { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-6); }
.dsf-item { display: grid; grid-template-columns: 2.25rem 1fr; gap: var(--sp-1) var(--sp-3); align-items: start;
            padding: var(--sp-3) var(--sp-4); border: 1px solid var(--border); border-left: 3px solid var(--border-strong);
            border-radius: 8px; background: var(--card); }
.dsf-item[data-st="wip"]  { border-left-color: var(--warn-border); background: var(--warn-bg); }
.dsf-item[data-st="done"] { border-left-color: var(--accent); }
.dsf-etapa { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: var(--fs-sm); color: var(--muted);
             font-variant-numeric: tabular-nums; padding-top: 0.1rem; }
.dsf-cab { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
.dsf-titulo { font-size: var(--fs-body); font-weight: 600; color: var(--fg); }
.dsf-item[data-st="done"] .dsf-titulo { color: var(--fg-soft); }
.dsf-item[data-st="wip"] .dsf-titulo { color: var(--warn-fg); }
.dsf-opcional { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
                border: 1px solid var(--border); border-radius: 999px; padding: 0 var(--sp-2); }
.dsf-oque { grid-column: 2; font-size: var(--fs-sm); line-height: 1.6; color: var(--fg-soft); max-width: var(--measure); }
.dsf-meta { grid-column: 2; font-size: var(--fs-xs); color: var(--muted); }
.dsf-trava { color: var(--warn-fg); }
.dsf-est { grid-column: 2; display: flex; gap: var(--sp-1); margin-top: var(--sp-1); }
.dsf-bt { font-size: var(--fs-xs); padding: var(--sp-1) var(--sp-3); border-radius: 999px; border: 1px solid var(--border);
          background: transparent; color: var(--fg-soft); cursor: pointer; font-family: inherit; }
.dsf-bt:hover { border-color: var(--border-strong); }
.dsf-bt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 500; }
.dsf-aviso { margin-top: var(--sp-6); font-size: var(--fs-xs); color: var(--muted); max-width: var(--measure); }

/* ===== Grafo ===== */
.content:has(.grf) { max-width: none; }
.grf-barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: var(--sp-4) 0 10px; }
.grf-tipo { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--border);
  border-radius: 999px; background: var(--card); color: var(--fg-soft); font-size: var(--fs-sm); cursor: pointer; }
.grf-tipo[aria-pressed="false"] { opacity: .45; }
.grf-ponto { width: 10px; height: 10px; border-radius: 50%; }
.grf-busca { margin-left: auto; min-width: 200px; padding: 6px 10px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg); color: var(--fg); font-size: var(--fs-sm); }
.grf-tela { height: 72vh; min-height: 420px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); }
.grf-dica { margin-top: 8px; font-size: var(--fs-xs); color: var(--muted); }
@media (max-width: 900px) { .grf-busca { margin-left: 0; width: 100%; } .grf-tela { height: 60vh; } }

/* ===== Telas de painel (biblioteca, raio-x, kit) ===== */
.content:has(.painel) { max-width: none; }
.pn-barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: var(--sp-4) 0 14px; }
.pn-chip { padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--card);
  color: var(--fg-soft); font-size: var(--fs-sm); cursor: pointer; }

// ========== APP STATE ==========
let currentFile = null;
let sidebarOpen = false;
let isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
const MIN_SIDEBAR = 200;
const MAX_SIDEBAR = 600;
const COLLAPSE_W = 64;

// ========== THEME ==========
function initTheme() {
  const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon(saved);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon(next);
}

// ========== SIDEBAR COLLAPSE ==========
function updateSidebarToggleBtn() {
  const btn = document.getElementById('sidebarToggle');
  if (isCollapsed) {
    btn.textContent = '⟩';
    btn.setAttribute('aria-label', 'Expandir painel');
    btn.setAttribute('title', 'Expandir painel (Ctrl+B)');
  } else {
    btn.textContent = '⟨';
    btn.setAttribute('aria-label', 'Recolher painel');
    btn.setAttribute('title', 'Recolher painel (Ctrl+B)');
  }
}
function toggleSidebarCollapse() {
  isCollapsed = !isCollapsed;
  document.documentElement.setAttribute('data-sidebar-collapsed', isCollapsed);
  localStorage.setItem('sidebarCollapsed', isCollapsed);
  updateSidebarToggleBtn();
  renderNav();
}

// ========== SIDEBAR RESIZE ==========
function initResizeHandle() {
  const handle = document.getElementById('resizeHandle');
  let startX = 0;
  let startW = 0;
  let pointerId = null;

  function onPointerMove(e) {
    const delta = e.clientX - startX;
    let newW = startW + delta;

    if (isCollapsed) {
      if (newW > COLLAPSE_W + 24) {
        isCollapsed = false;
        document.documentElement.setAttribute('data-sidebar-collapsed', 'false');
        updateSidebarToggleBtn();
        renderNav();
      } else {
        return;
      }
    } else if (newW < COLLAPSE_W + 24) {
      isCollapsed = true;
      document.documentElement.setAttribute('data-sidebar-collapsed', 'true');
      updateSidebarToggleBtn();
      renderNav();
      return;
    }

    newW = Math.max(MIN_SIDEBAR, Math.min(MAX_SIDEBAR, newW));
    document.documentElement.style.setProperty('--sidebar-w', newW + 'px');
  }
  function onPointerUp() {
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';

    if (isCollapsed) {
      localStorage.setItem('sidebarCollapsed', 'true');
      return;
    }
    const currentW = document.documentElement.style.getPropertyValue('--sidebar-w');
    localStorage.setItem('sidebarWidth', currentW);
    if (handle.hasPointerCapture(pointerId)) handle.releasePointerCapture(pointerId);
  }
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    pointerId = e.pointerId;
    startX = e.clientX;
    const style = getComputedStyle(document.documentElement);
    startW = parseFloat(style.getPropertyValue('--sidebar-w')) || 280;
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
  });
}

// ========== RESTORE SIDEBAR STATE ==========
function initSidebarState() {
  const savedW = localStorage.getItem('sidebarWidth');
  if (savedW) {
    document.documentElement.style.setProperty('--sidebar-w', savedW);
  }
  document.documentElement.setAttribute('data-sidebar-collapsed', isCollapsed);
  updateSidebarToggleBtn();
}
function updateThemeIcon(theme) {
  const btn = document.getElementById('themeToggle');
  btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  btn.setAttribute('aria-pressed', theme === 'dark');
}

// ========== SIDEBAR MOBILE ==========
function toggleSidebar(open) {
  sidebarOpen = open;
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('mobileToggle');
  if (open) {
    sidebar.classList.add('open');
    toggle.setAttribute('aria-expanded', 'true');
  } else {
    sidebar.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  }
}
function closeMobileMenu() { toggleSidebar(false); }

// ========== NAV RENDER ==========
function moduleKey(cat) {
  const m = cat.match(/M[óo]dulo\s+(\d+|IV|[IV]+)/i);
  if (m) return m[1].toUpperCase();
  if (cat === 'Config') return '\u25cf';
  // Fallback seguro pra qualquer categoria futura: o chip tem largura de icone,
  // e o title dele ja carrega o nome completo.
  return cat.replace(/[^A-Za-zÀ-ÿ0-9]/g, '').slice(0, 2).toUpperCase();
}

function renderNav() {
  const nav = document.getElementById('nav');
  const byCat = FILES.reduce((acc, f) => {
    (acc[f.cat] = acc[f.cat] || []).push(f);
    return acc;
  }, {});

  if (isCollapsed) {
    // Modo reduzido: um chip por módulo, clica para expandir e mostrar
    nav.innerHTML = Object.keys(byCat).map(cat => `
      <button class="nav-chip" data-cat="${escapeHtml(cat)}" title="${escapeHtml(cat)}">
        <span class="chip-key">${escapeHtml(moduleKey(cat))}</span>
      </button>
    `).join('');
    nav.querySelectorAll('.nav-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const first = FILES.find(f => f.cat === chip.dataset.cat);
        if (first) loadFile(first.id);
      });
      chip.addEventListener('pointerdown', () => { chip.style.transform = 'scale(0.94)'; });
      chip.addEventListener('pointerup', () => { chip.style.transform = ''; });
      chip.addEventListener('pointerleave', () => { chip.style.transform = ''; });
    });
    return;
  }

  nav.innerHTML = Object.entries(byCat).map(([cat, files]) => `
    <section class="nav-section" aria-labelledby="cat-${cat.toLowerCase().replace(/\s+/g, '-')}">
      <h2 class="nav-label" id="cat-${cat.toLowerCase().replace(/\s+/g, '-')}">${cat}</h2>
      ${files.map(f => `
        <a class="nav-link ${f.id === currentFile ? 'active' : ''}" 
           href="#" data-id="${f.id}" title="${escapeHtml(f.title || f.label)}"
           ${f.id === currentFile ? 'aria-current="page"' : ''}>
          ${f.label}
        </a>
      `).join('')}
    </section>
  `).join('');

  nav.querySelectorAll('.nav-link').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); loadFile(a.dataset.id); closeMobileMenu(); });
    // Instant feedback on pointer-down (Apple principle: respond on press)
    a.addEventListener('pointerdown', () => { a.style.transform = 'scale(0.98)'; });
    a.addEventListener('pointerup', () => { a.style.transform = ''; });
    a.addEventListener('pointerleave', () => { a.style.transform = ''; });
  });
}

// ========== FILE LOAD ==========
async function loadFile(id) {
  const file = FILES.find(f => f.id === id);
  if (!file) return;
  
  currentFile = id;
  renderNav();
  updateFileNav();
  showLoading();
  
  try {
    const res = await fetch(file.path, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    const text = await res.text();
    renderContent(file, text);
  } catch (err) {
    renderError(file, err.message);
  }
}

// ========== FILE NAV ==========
function updateFileNav() {
  const nav = document.getElementById('fileNav');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const idx = FILES.findIndex(f => f.id === currentFile);
  if (idx === -1) { nav.hidden = true; return; }

  nav.hidden = false;
  const prev = FILES[idx - 1];
  const next = FILES[idx + 1];
  document.getElementById('prevTitle').textContent = prev ? (prev.title || prev.label) : '';
  document.getElementById('nextTitle').textContent = next ? (next.title || next.label) : '';
  prevBtn.disabled = !prev;
  nextBtn.disabled = !next;
}

function showLoading() {
  const content = document.getElementById('content');
  const emptyHint = document.getElementById('emptyHint');
  emptyHint.hidden = true;
  content.hidden = false;
  content.innerHTML = '<p style="color:var(--muted);text-align:center;padding:3rem;">Carregando…</p>';
}

function renderContent(file, text) {
  const content = document.getElementById('content');
  const emptyHint = document.getElementById('emptyHint');
  emptyHint.hidden = true;
  content.hidden = false;

  // Tem de ser return no topo: mais abaixo o isMd embrulharia o JSON num <pre>
  // e o formatBytes imprimiria o tamanho do arquivo no cabecalho.
  const custom = file.view && VIEWS[file.view];
  if (custom) return custom(file, text);

  const isMd = file.path.endsWith('.md');
  let html = isMd ? marked.parse(text) : '<pre><code>' + escapeHtml(text) + '</code></pre>';

  // O .md e injetado na pagina raiz, entao caminho relativo dentro dele
  // resolveria contra a raiz e nao contra a pasta do material. Reescreve
  // src/href relativos com o diretorio do proprio arquivo, pra imagem
  // (ex: diagrama.svg ao lado do resumo) funcionar aqui e no GitHub.
  if (isMd) {
    const dir = file.path.includes('/') ? file.path.replace(/\/[^/]*$/, '/') : '';
    if (dir) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      tmp.querySelectorAll('img[src], a[href]').forEach(el => {
        const attr = el.tagName === 'IMG' ? 'src' : 'href';
        const v = el.getAttribute(attr) || '';
        if (v && !/^([a-z]+:|\/|#|\?)/i.test(v)) el.setAttribute(attr, dir + v);
      });
      html = tmp.innerHTML;
    }
  }

  content.innerHTML = `
    <header class="main-header">
      <span class="module-badge">${escapeHtml(file.cat)}</span>
      <h1 class="main-title">${escapeHtml(file.title || file.label)}</h1>
      <div class="main-meta">${escapeHtml(file.path)} · ${formatBytes(text.length)}</div>
    </header>
    <div class="markdown-body">${html}</div>
  `;
  
  // Smooth scroll for internal links
  content.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.querySelector(a.getAttribute('href'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  
  // Apply spring entrance to content
  content.style.animation = 'none';
  requestAnimationFrame(() => {
    content.style.animation = 'fadeIn 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  });
}

// ========== TELA DO DESAFIO ==========
const DSF_KEY = 'ae_desafio_v1';
const DSF_ESTADOS = [
  { v: 'todo', rot: 'Nao comecado' },
  { v: 'wip',  rot: 'Em andamento' },
  { v: 'done', rot: 'Pronto' },
];

// localStorage lanca em modo privado e por cota. Um throw aqui mataria o toggle
// em silencio, entao os dois lados sao tolerantes a falha.
function dsfLer() {
  try {
    const cru = JSON.parse(localStorage.getItem(DSF_KEY) || '{}');
    const ok = {};
    const validos = DSF_ESTADOS.map(e => e.v);
    for (const [k, v] of Object.entries(cru)) ok[k] = validos.includes(v) ? v : 'todo';
    return ok;
  } catch (e) { return {}; }
}
function dsfGravar(st) {
  try { localStorage.setItem(DSF_KEY, JSON.stringify(st)); return true; }
  catch (e) { return false; }
}

function renderDesafio(file, text) {
  const content = document.getElementById('content');
  let itens;
  try {
    itens = JSON.parse(text);
    if (!Array.isArray(itens)) throw new Error('esperava uma lista de entregaveis');
  } catch (e) {
    return renderError(file, 'JSON invalido em ' + file.path + ': ' + e.message);
  }

  // Ids gravados que nao existem mais no JSON sao ignorados, nunca apagados:
  // um rename revertido volta a funcionar. E o denominador vem do JSON, nunca
  // das chaves gravadas.
  const st = dsfLer();
  const estado = id => st[id] || 'todo';
  const obrig = itens.filter(i => !i.opcional);
  const prontos = obrig.filter(i => estado(i.id) === 'done').length;
  const pct = obrig.length ? Math.round((prontos / obrig.length) * 100) : 0;

  const trava = it => (it.depende_de || [])
    .filter(d => estado(d) !== 'done')
    .map(d => (itens.find(x => x.id === d) || {}).titulo || d);

  content.innerHTML = `
    <header class="main-header">
      <span class="module-badge">${escapeHtml(file.cat)}</span>
      <h1 class="main-title">${escapeHtml(file.title || file.label)}</h1>
      <div class="dsf-resumo">
        <div class="dsf-barra" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"
             aria-label="Progresso dos entregaveis obrigatorios"><span style="width:${pct}%"></span></div>
        <span class="dsf-contagem">${prontos} de ${obrig.length} obrigatorios &middot; ${pct}%</span>
        <span class="dsf-acoes">
          <button class="dsf-acao" id="dsfCopiar" type="button">Copiar progresso</button>
          <button class="dsf-acao" id="dsfImportar" type="button">Importar</button>
        </span>
      </div>
    </header>
    <div class="dsf-lista">
      ${itens.map(it => {
        const s = estado(it.id);
        const pend = trava(it);
        return `
        <div class="dsf-item" data-st="${s}" data-id="${escapeHtml(it.id)}">
          <span class="dsf-etapa">${escapeHtml(String(it.etapa ?? '-'))}</span>
          <div class="dsf-cab">
            <span class="dsf-titulo">${escapeHtml(it.titulo || it.id)}</span>
            ${it.opcional ? '<span class="dsf-opcional">opcional</span>' : ''}
          </div>
          <p class="dsf-oque">${escapeHtml(it.oque || '')}</p>
          <div class="dsf-meta">${escapeHtml(it.formato || '')}${
            pend.length ? ' &middot; <span class="dsf-trava">espera: ' + escapeHtml(pend.join(', ')) + '</span>' : ''
          }</div>
          <div class="dsf-est" role="group" aria-label="Estado de ${escapeHtml(it.titulo || it.id)}">
            ${DSF_ESTADOS.map(e => `
              <button class="dsf-bt" type="button" data-v="${e.v}"
                      aria-pressed="${s === e.v}">${e.rot}</button>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
    <p class="dsf-aviso">O progresso fica no navegador (localStorage), nao no git &mdash; e por origem,
      entao localhost e uma versao publicada nao compartilham marcacao. Use "Copiar progresso"
      pra guardar.</p>
  `;

  content.querySelectorAll('.dsf-item').forEach(card => {
    card.querySelectorAll('.dsf-bt').forEach(bt => {
      bt.addEventListener('click', () => {
        const atual = dsfLer();
        atual[card.dataset.id] = bt.dataset.v;
        if (!dsfGravar(atual)) {
          alert('Nao foi possivel gravar o progresso neste navegador (modo privado ou cota cheia).');
          return;
        }
        renderDesafio(file, text);
      });
    });
  });

  document.getElementById('dsfCopiar').addEventListener('click', async (ev) => {
    const bt = ev.currentTarget;
    const txt = JSON.stringify(dsfLer(), null, 2);
    try {
      await navigator.clipboard.writeText(txt);
      bt.textContent = 'Copiado';
      setTimeout(() => { bt.textContent = 'Copiar progresso'; }, 1500);
    } catch (e) {
      // Fora de contexto seguro (aberto por IP na rede) a Clipboard API nao existe.
      window.prompt('Copie o progresso:', txt);
    }
  });

  document.getElementById('dsfImportar').addEventListener('click', () => {
    const cru = window.prompt('Cole o JSON de progresso:');
    if (!cru) return;
    try {
      const novo = JSON.parse(cru);
      if (typeof novo !== 'object' || novo === null || Array.isArray(novo)) {
        throw new Error('esperava um objeto');
      }
      if (!dsfGravar(novo)) throw new Error('nao foi possivel gravar neste navegador');
      renderDesafio(file, text);
    } catch (e) {
      alert('Nao importei: ' + e.message);
    }
  });
}

// ========== TELA DO GRAFO ==========
const GRF_LIB = 'https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js';
let grfCarregando = null;
function grfBiblioteca() {
  if (window.cytoscape) return Promise.resolve();
  if (!grfCarregando) grfCarregando = new Promise((ok, falha) => {
    const s = document.createElement('script');
    s.src = GRF_LIB; s.onload = ok; s.onerror = () => falha(new Error('não carregou a biblioteca do grafo (sem internet?)'));
    document.head.appendChild(s);
  });
  return grfCarregando;
}

function renderGrafo(file, text) {
  const dados = JSON.parse(text);
  const content = document.getElementById('content');
  const contagem = {};
  dados.nos.forEach(n => { contagem[n.tipo] = (contagem[n.tipo] || 0) + 1; });

  content.innerHTML = `
    <div class="grf">
      <header class="main-header">
        <span class="module-badge">${escapeHtml(file.cat)}</span>
        <h1 class="main-title">${escapeHtml(file.title)}</h1>

      </header>
      <div class="grf-barra">
        ${Object.entries(dados.tipos).map(([t, d]) => `
          <button class="grf-tipo" type="button" data-tipo="${t}" aria-pressed="true">
            <span class="grf-ponto" style="background:${d.cor}"></span>${escapeHtml(d.rotulo)} · ${contagem[t] || 0}
          </button>`).join('')}
        <input class="grf-busca" id="grfBusca" type="search" placeholder="Buscar nó…" aria-label="Buscar nó no grafo">
      </div>
      <div class="grf-tela" id="grfTela" role="img" aria-label="Grafo da formação"></div>
      <p class="grf-dica">Passe o mouse para destacar as ligações · clique num nó para abrir o material · arraste e role para navegar.</p>
    </div>`;

  grfBiblioteca().then(() => grfDesenhar(dados)).catch(e => renderError(file, e.message));
}

function grfDesenhar(dados) {
  const css = getComputedStyle(document.documentElement);
  const fg = css.getPropertyValue('--fg').trim() || '#1a1a2e';
  const borda = css.getPropertyValue('--border-strong').trim() || '#c9c9d6';
  const tamanho = { modulo: 34, etapa: 30, ferramenta: 28, skill: 22, material: 12 };

  const cy = cytoscape({
    container: document.getElementById('grfTela'),
    elements: [
      ...dados.nos.map(n => ({ data: { ...n, cor: dados.tipos[n.tipo].cor, tam: tamanho[n.tipo] || 16 } })),
      ...dados.ligacoes.map(([a, b], i) => ({ data: { id: 'l' + i, source: a, target: b } })),
    ],
    style: [
      { selector: 'node', style: {
        'background-color': 'data(cor)', width: 'data(tam)', height: 'data(tam)',
        label: 'data(rotulo)', color: fg, 'font-size': 14, 'text-valign': 'bottom', 'text-margin-y': 4,
        'text-wrap': 'ellipsis', 'text-max-width': 160, 'min-zoomed-font-size': 3,
        'text-outline-color': css.getPropertyValue('--card').trim() || '#fff', 'text-outline-width': 2 } },
      // Material tem nome longo e sao 78: so aparece ao aproximar, senao vira borrao.
      { selector: 'node[tipo = "material"]', style: { 'font-size': 9, 'min-zoomed-font-size': 9 } },
      { selector: 'node[?nova]', style: { 'border-width': 3, 'border-color': '#f0c040' } },
      { selector: 'edge', style: { width: 1, 'line-color': borda, 'curve-style': 'haystack', opacity: .7 } },
      { selector: '.apagado', style: { opacity: .12 } },
      { selector: '.escondido', style: { display: 'none' } },
      { selector: 'node.foco', style: { 'border-width': 3, 'border-color': fg } },
    ],
    layout: { name: 'cose', animate: false, nodeRepulsion: 9000, idealEdgeLength: 70, gravity: 0.6, randomize: true },
    wheelSensitivity: 0.25,
  });

  cy.on('mouseover', 'node', e => {
    const viz = e.target.closedNeighborhood();
    cy.elements().not(viz).addClass('apagado');
  });
  cy.on('mouseout', 'node', () => cy.elements().removeClass('apagado'));
  cy.on('tap', 'node', e => { const f = e.target.data('arquivo'); if (f) loadFile(f); });

  document.querySelectorAll('.grf-tipo').forEach(b => b.addEventListener('click', () => {
    const ligado = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(ligado));
    cy.nodes(`[tipo = "${b.dataset.tipo}"]`).toggleClass('escondido', !ligado);
  }));

  document.getElementById('grfBusca').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    cy.nodes().removeClass('foco');
    if (!q) return;
    const achados = cy.nodes().filter(n => (n.data('rotulo') || '').toLowerCase().includes(q));
    achados.addClass('foco');
    if (achados.length) cy.animate({ fit: { eles: achados.closedNeighborhood(), padding: 60 }, duration: 350 });
  });
}

  content.innerHTML = `

  function desenhar() {
    const q = busca.value.trim().toLowerCase();
    const lista = skills.filter(s => (filtro === 'todas' || s.origem === filtro)
      && (!q || (s.nome + ' ' + s.descricao + ' ' + s.gatilhos.join(' ')).toLowerCase().includes(q)));
    grade.innerHTML = lista.map(s => `
      <article class="bib-card">
        <div class="bib-topo"><span class="bib-nome">${escapeHtml(s.nome)}</span><span class="bib-origem">${escapeHtml(s.origem)}</span></div>
        <p class="bib-desc" title="${escapeHtml(s.descricao)}">${escapeHtml(s.descricao)}</p>
        ${s.gatilhos.length ? `<div class="bib-gatilhos">${s.gatilhos.map(g => `<span class="bib-gatilho">${escapeHtml(g)}</span>`).join('')}</div>` : ''}
        <div class="bib-acoes">
          <button class="bib-btn" type="button" data-copiar="${escapeHtml(s.instalar.powershell)}">Copiar (PowerShell)</button>
          <button class="bib-btn" type="button" data-copiar="${escapeHtml(s.instalar.bash)}">Copiar (bash)</button>
          ${s.arquivo ? `<button class="bib-btn" type="button" data-abrir="${escapeHtml(s.arquivo)}">Abrir SKILL.md</button>` : ''}
        </div>
      </article>`).join('') || '<p class="bib-desc">Nenhuma skill encontrada.</p>';

    grade.querySelectorAll('[data-copiar]').forEach(b => b.addEventListener('click', async () => {
      const original = b.textContent;
      try { await navigator.clipboard.writeText(b.dataset.copiar); b.textContent = 'Copiado ✓'; }
      catch { b.textContent = 'Copie manualmente'; }
      setTimeout(() => { b.textContent = original; }, 1600);
    }));
    grade.querySelectorAll('[data-abrir]').forEach(b => b.addEventListener('click', () => loadFile(b.dataset.abrir)));
  }

  content.querySelectorAll('[data-origem]').forEach(b => b.addEventListener('click', () => {
    filtro = b.dataset.origem;
    content.querySelectorAll('[data-origem]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    desenhar();
  }));
  busca.addEventListener('input', desenhar);
  desenhar();
}

    </tbody></table></div>`;
}

let rxCy = null;
let rxDados = null;
function rxDependencias(corpo, d) {
  rxDados = d;
  rxCy = null;  // o grafo anterior foi descartado com o HTML; rxFocar espera o novo
  corpo.innerHTML = `
    <div class="rx-dep">
      <div class="grf-tela" id="rxTela" role="img" aria-label="Grafo de dependências das medidas"></div>
      <aside class="rx-painel" id="rxPainel"><h3>Dependências</h3><p>Clique numa medida para ver o DAX, o que ela usa e o que quebra se ela mudar. Medidas em cor, colunas em cinza.</p></aside>
    </div>`;
  grfBiblioteca().then(() => {
    const css = getComputedStyle(document.documentElement);
    const fg = css.getPropertyValue('--fg').trim();
    const borda = css.getPropertyValue('--border-strong').trim();
    rxCy = cytoscape({
      container: document.getElementById('rxTela'),
      elements: [
        ...d.dependencias.nos.map(n => ({ data: { ...n } })),
        ...d.dependencias.ligacoes.map(([a, b], i) => ({ data: { id: 'l' + i, source: a, target: b } })),
      ],
      style: [
        { selector: 'node', style: { label: 'data(rotulo)', color: fg, 'font-size': 10, 'text-valign': 'bottom', 'text-margin-y': 3,
          'text-outline-color': css.getPropertyValue('--card').trim(), 'text-outline-width': 2, 'min-zoomed-font-size': 6 } },
        { selector: 'node[tipo = "medida"]', style: { 'background-color': '#5b6cf0', width: 18, height: 18 } },
        { selector: 'node[tipo = "coluna"]', style: { 'background-color': '#9aa3b5', width: 9, height: 9, 'font-size': 8, 'min-zoomed-font-size': 9 } },
        { selector: 'edge', style: { width: 1, 'line-color': borda, 'target-arrow-color': borda, 'target-arrow-shape': 'triangle',
          'arrow-scale': .7, 'curve-style': 'bezier', opacity: .8 } },
        { selector: '.apagado', style: { opacity: .1 } },
        { selector: 'node.foco', style: { 'border-width': 3, 'border-color': fg } },
      ],
      layout: { name: 'cose', animate: false, nodeRepulsion: 7000, idealEdgeLength: 60 },
      wheelSensitivity: 0.25,
    });
    rxCy.on('tap', 'node[tipo = "medida"]', e => rxFocar(e.target.data('rotulo')));
    rxCy.on('tap', e => { if (e.target === rxCy) { rxCy.elements().removeClass('apagado foco'); } });
  }).catch(e => { corpo.innerHTML = `<p class="bib-desc">${escapeHtml(e.message)}</p>`; });
}

function rxFocar(nome) {
  const tentar = () => {
    if (!rxCy) return setTimeout(tentar, 150);
    const m = rxDados.medidas.find(x => x.nome === nome);
    const no = rxCy.getElementById('m:' + nome);
    rxCy.elements().removeClass('apagado foco');
    if (no.nonempty()) {
      const ligado = no.closedNeighborhood().union(no.predecessors()).union(no.successors());
      rxCy.elements().not(ligado).addClass('apagado');
      no.addClass('foco');
      rxCy.animate({ fit: { eles: ligado, padding: 50 }, duration: 300 });
    }
    const li = xs => xs.length ? `<ul class="rx-lista">${xs.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>` : '<p>—</p>';
    document.getElementById('rxPainel').innerHTML = `
      <h3>${escapeHtml(m.nome)}</h3>
      <p>${escapeHtml(m.tabela)}${m.formato ? ' · formato ' + escapeHtml(m.formato) : ''}${m.usada_no_relatorio === false ? ' · <b>não usada no relatório</b>' : ''}</p>
      ${m.descricao ? `<p>${escapeHtml(m.descricao)}</p>` : ''}
      <pre>${escapeHtml(m.dax)}</pre>
      <b>Usa medidas</b>${li(m.usa_medidas)}
      <b>Usa colunas</b>${li(m.usa_colunas)}
      <b>Impacta se mudar (${m.impacta.length})</b>${li(m.impacta)}`;
  };
  tentar();
}

// ========== TELA DO KIT VISUAL ==========
// Contraste pela luminância relativa da WCAG 2.1.
function kitLum(hex) {
  const c = hex.replace('#', '').match(/.{2}/g).map(v => parseInt(v, 16) / 255)
    .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function kitContraste(a, b) {
  const [x, y] = [kitLum(a), kitLum(b)].sort((p, q) => q - p);
  return (x + 0.05) / (y + 0.05);
}
function kitTextoSobre(fundo) { return kitContraste(fundo, '#FFFFFF') >= kitContraste(fundo, '#111111') ? '#FFFFFF' : '#111111'; }

function renderKit(file, text) {

    st.filtros = $('kFiltros').checked; st.borda = $('kBorda').checked;
    st.cards = Math.min(regras.limites.cards_max, Math.max(regras.limites.cards_min, +$('kCards').value || 4));
    st.colunas_graficos = +$('kCols').value;

  function checar() {
    const m = regras.modos[st.modo];
    const pares = [
      ['Texto sobre o cartão', m.texto, m.cartao, regras.contraste.texto],

      ...st.paleta.map((c, i) => [`Cor ${i + 1} do gráfico`, c, m.cartao, regras.contraste.grafico]),
      ['Resultado bom', st.bom, m.cartao, regras.contraste.grafico],
      ['Resultado ruim', st.ruim, m.cartao, regras.contraste.grafico],

  function desenhar() { ler(); $('kitPreview').innerHTML = kitSvg(regras, st, true); checar(); }

  function baixar(nome, conteudo, tipo) {
    const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
    const a = Object.assign(document.createElement('a'), { href: url, download: nome });

  $('kitFundo').addEventListener('click', () => baixar(`fundo-${arquivo()}.svg`, kitSvg(regras, st, false), 'image/svg+xml'));
  desenhar();
}

// Mesma geometria no preview e no fundo exportado; o fundo sai sem texto nem dado.
function kitLayout(r, st) {
  const W = r.canvas.largura, H = r.canvas.altura, M = r.grade.margem, G = r.grade.gutter, A = r.alturas;
  const caixas = [];
  const cab = { x: 0, y: 0, w: W, h: A.cabecalho, papel: 'cabecalho' };
  let x0 = M, y = A.cabecalho + M;
  let nav = null;
  if (st.navegacao === 'lateral') {
    nav = { x: 0, y: A.cabecalho, w: r.navegacao_lateral.largura, h: H - A.cabecalho, papel: 'nav' };
    x0 = r.navegacao_lateral.largura + M;
  } else if (st.navegacao === 'topo') {
    nav = { x: 0, y: A.cabecalho, w: W, h: A.navegacao_topo, papel: 'nav' };
    y += A.navegacao_topo;
  }
  const largura = W - x0 - M;
  if (st.filtros) { caixas.push({ x: x0, y, w: largura, h: A.filtros, papel: 'filtros' }); y += A.filtros + G; }
  const wc = (largura - G * (st.cards - 1)) / st.cards;
  for (let i = 0; i < st.cards; i++) caixas.push({ x: x0 + i * (wc + G), y, w: wc, h: A.cards, papel: 'card', i });
  y += A.cards + G;
  const altRest = H - M - y, hg = (altRest - G * (st.linhas_graficos - 1)) / st.linhas_graficos;
  const wg = (largura - G * (st.colunas_graficos - 1)) / st.colunas_graficos;
  let k = 0;
  for (let l = 0; l < st.linhas_graficos; l++)
    for (let c = 0; c < st.colunas_graficos; c++)
      caixas.push({ x: x0 + c * (wg + G), y: y + l * (hg + G), w: wg, h: hg, papel: 'grafico', i: k++ });
  return { W, H, cab, nav, caixas };
}

function kitSvg(r, st, preview) {
  const m = r.modos[st.modo], L = kitLayout(r, st), f = n => n.toFixed(1);
  const borda = st.borda ? ` stroke="${m.borda}" stroke-width="1"` : '';
  const txtCab = kitTextoSobre(st.primaria);
  const partes = [`<rect width="${L.W}" height="${L.H}" fill="${m.pagina}"/>`,
    `<rect x="0" y="0" width="${L.W}" height="${L.cab.h}" fill="${st.primaria}"/>`];
  if (st.logo) partes.push(`<image href="${st.logo}" x="${r.grade.margem}" y="12" height="${L.cab.h - 24}" width="160" preserveAspectRatio="xMinYMid meet"/>`);
  if (preview) partes.push(`<text x="${st.logo ? 200 : r.grade.margem}" y="${L.cab.h / 2 + 6}" fill="${txtCab}" font-family="Segoe UI, Arial" font-size="18" font-weight="600">${escapeHtml(st.nome)}</text>`);
  if (L.nav) {
    partes.push(`<rect x="${L.nav.x}" y="${L.nav.y}" width="${L.nav.w}" height="${L.nav.h}" fill="${m.cartao}"${borda}/>`);
    if (preview) for (let i = 0; i < 4; i++) {
      const lateral = st.navegacao === 'lateral';
      const x = lateral ? L.nav.w / 2 - 12 : r.grade.margem + i * 120, y = lateral ? L.nav.y + 24 + i * 52 : L.nav.y + 10;
      partes.push(`<rect x="${x}" y="${y}" width="${lateral ? 24 : 100}" height="${lateral ? 24 : 20}" rx="4" fill="${i === 0 ? st.primaria : m.borda}"/>`);
    }
  }
  for (const c of L.caixas) {
    partes.push(`<rect x="${f(c.x)}" y="${f(c.y)}" width="${f(c.w)}" height="${f(c.h)}" rx="${st.raio}" fill="${m.cartao}"${borda}/>`);
    if (!preview) continue;
    if (c.papel === 'filtros') for (let i = 0; i < 4; i++)
      partes.push(`<rect x="${f(c.x + 16 + i * 150)}" y="${f(c.y + 16)}" width="134" height="24" rx="4" fill="none" stroke="${m.borda}"/>`);
    if (c.papel === 'card') {
      const bom = c.i % 2 === 0;
      partes.push(`<text x="${f(c.x + 16)}" y="${f(c.y + 30)}" fill="${m.texto_suave}" font-family="Segoe UI, Arial" font-size="12">KPI ${c.i + 1}</text>`,
        `<text x="${f(c.x + 16)}" y="${f(c.y + 64)}" fill="${m.texto}" font-family="Segoe UI, Arial" font-size="26" font-weight="600">${(12 + c.i * 7).toFixed(1)} mi</text>`,
        `<text x="${f(c.x + 16)}" y="${f(c.y + 84)}" fill="${bom ? st.bom : st.ruim}" font-family="Segoe UI, Arial" font-size="12">${bom ? '▲ 4,2%' : '▼ 1,8%'}</text>`);
    }
    if (c.papel === 'grafico') {
      const n = 6, base = c.y + c.h - 20, alt = c.h - 60, bw = (c.w - 40) / n;
      partes.push(`<text x="${f(c.x + 16)}" y="${f(c.y + 24)}" fill="${m.texto}" font-family="Segoe UI, Arial" font-size="13" font-weight="600">Gráfico ${c.i + 1}</text>`);
      for (let b = 0; b < n; b++) {
        const h = alt * (0.35 + 0.6 * Math.abs(Math.sin((b + 1) * (c.i + 2))));
        partes.push(`<rect x="${f(c.x + 20 + b * bw + bw * 0.15)}" y="${f(base - h)}" width="${f(bw * 0.7)}" height="${f(h)}" rx="2" fill="${st.paleta[b % st.paleta.length]}"/>`);
      }
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${L.W} ${L.H}" width="${L.W}" height="${L.H}">${partes.join('')}</svg>`;
}

function kitTema(r, st) {
  const m = r.modos[st.modo];
  const solido = cor => ({ solid: { color: cor } });
  return {
    name: st.nome,
    dataColors: st.paleta,
    background: m.cartao,
    foreground: m.texto,
    tableAccent: st.primaria,
    good: st.bom, bad: st.ruim, neutral: r.padrao.neutro,
    textClasses: {
      title: { fontFace: r.fontes.titulo, fontSize: 12, color: m.texto },
      header: { fontFace: r.fontes.titulo, fontSize: 12, color: m.texto },
      label: { fontFace: r.fontes.texto, fontSize: 10, color: m.texto_suave },
      callout: { fontFace: r.fontes.numero, fontSize: 28, color: m.texto },
    },
    visualStyles: {
      '*': { '*': {
        background: [{ show: true, color: solido(m.cartao), transparency: 0 }],
        border: [{ show: st.borda, color: solido(m.borda), radius: st.raio }],
        title: [{ fontColor: solido(m.texto) }],
      } },
      page: { '*': {
        background: [{ color: solido(m.pagina), transparency: 0 }],
        outspace: [{ color: solido(m.pagina) }],
      } },
    },
  };
}

function escapeHtml(str) {
  // Cuidado: as substituicoes tinham virado identidade ('&' -> '&') e a ultima
  // injetava um backslash-apostrofo literal na pagina. Ficou dormindo porque
  // nenhum material tinha < & " ' no titulo. A tela do desafio renderiza texto
  // de JSON, e ai acorda. As entidades abaixo tem de continuar escritas por extenso.
  return String(str ?? '')
    .replace(/&/g, '&' + 'amp;')
    .replace(/</g, '&' + 'lt;')
    .replace(/>/g, '&' + 'gt;')
    .replace(/"/g, '&' + 'quot;')
    .replace(/'/g, '&' + '#39;');
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

function goPrev() {
  const idx = FILES.findIndex(f => f.id === currentFile);
  if (idx > 0) loadFile(FILES[idx - 1].id);
}
function goNext() {
  const idx = FILES.findIndex(f => f.id === currentFile);
  if (idx >= 0 && idx < FILES.length - 1) loadFile(FILES[idx + 1].id);
}
document.getElementById('prevBtn').addEventListener('click', goPrev);

// Click on main content area closes mobile menu
document.getElementById('main').addEventListener('click', () => {
  if (window.innerWidth <= 900) closeMobileMenu();
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sidebarOpen) closeMobileMenu();
  if (e.key === 'b' && e.ctrlKey) { e.preventDefault(); toggleSidebarCollapse(); }
  // Seta so navega entre materiais se o foco nao estiver num controle. Sem isso
  // o toggle de estado do desafio mudava o valor E saltava de pagina no mesmo evento.
  const emControle = e.target?.closest?.('input,select,textarea,button,[contenteditable]');
  if (e.key === 'ArrowLeft' && currentFile && !emControle) { e.preventDefault(); goPrev(); }
  if (e.key === 'ArrowRight' && currentFile && !emControle) { e.preventDefault(); goNext(); }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('nav').querySelector('.nav-link')?.focus();
  }
});


// ==== Version + update check ====
async function initVersion() {
  let local = null;
  try {
    const r = await fetch('version.json', { cache: 'no-store' });
    if (r.ok) local = await r.json();
  } catch (e) { /* sem version.json */ }
  const badge = document.getElementById('versionBadge');
  if (local && local.short) {
    badge.textContent = 'v' + local.short + ' - ' + (local.date || '').slice(5);
    badge.title = (local.message || '') + '\n' + (local.sha || '');
    const seen = localStorage.getItem('ae_seen_version');
    if (seen && seen !== local.sha) {
      showBanner('Conteudo atualizado localmente (' + local.short + ').', null);
    }
    localStorage.setItem('ae_seen_version', local.sha || '');
    localStorage.setItem('ae_repo', local.repo || '');
  } else {
    badge.textContent = 'v?';
  }
  document.getElementById('checkUpdates').addEventListener('click', checkRemote);
  document.getElementById('updateDismiss').addEventListener('click', () => {
    document.getElementById('updateBanner').hidden = true;
  });
}
function showBanner(text, diffUrl) {
  document.getElementById('updateText').textContent = text;
  const link = document.getElementById('updateLink');
  if (diffUrl) { link.href = diffUrl; link.style.display = ''; }
  else { link.style.display = 'none'; }
  document.getElementById('updateBanner').hidden = false;
}
async function checkRemote() {
  const btn = document.getElementById('checkUpdates');
  btn.disabled = true; btn.textContent = '...';
  try {
    const repo = localStorage.getItem('ae_repo') || '';
    if (!repo) { showBanner('Repo GitHub nao configurado no version.json.', null); return; }
    const r = await fetch('https://api.github.com/repos/' + repo + '/commits?per_page=1');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const arr = await r.json();
    const latest = arr[0];
    const localR = await (await fetch('version.json', { cache: 'no-store' })).json();
    if (latest.sha !== localR.sha) {
      showBanner('Ha atualizacoes! Local v' + (localR.short || '?') + ' > remoto v' + latest.sha.slice(0, 7) + '. Rode git pull + sync.',
        'https://github.com/' + repo + '/compare/' + localR.sha + '...' + latest.sha);
    } else {
      showBanner('Voce esta atualizado (v' + (localR.short || '?') + ').', null);
    }
  } catch (e) {
    showBanner('Nao foi possivel verificar: ' + e.message, null);
  } finally {
    btn.disabled = false; btn.textContent = 'Verificar';
  }
}

// Init
initTheme();
initVersion();
initSidebarState();
renderNav();
if (FILES.length) loadFile(FILES[0].id); else document.getElementById('emptyHint').hidden = false;
</script>
